version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: testbook-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: testbook
    volumes:
      - mongodb_data:/data/db
    networks:
      - testbook-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: testbook-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - testbook-network

  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: testbook-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb+srv://itinfo60:hHWTKq5QzG.ciJ7@cluster0.st80uui.mongodb.net/Test-Book?appName=Cluster0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - testbook-network

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: testbook-client
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - testbook-network

volumes:
  mongodb_data:
  redis_data:

networks:
  testbook-network:
    driver: bridge