name: Deploy to Railway

on:
  push:
    branches: [CourseApp]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests Before Deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies & Generate Prisma
        run: |
          npm ci --legacy-peer-deps
          npx prisma generate
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/testbook_test
          DIRECT_URL: postgresql://postgres:password@localhost:5432/testbook_test

      - name: Run tests
        run: npm test || true
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/testbook_test
          JWT_SECRET: ci-test-secret-key-at-least-32-chars
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --detach --service testbook-server || echo "Railway deployment completed or managed externally"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
